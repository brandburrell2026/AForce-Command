<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
      </marker>
    </defs>
    <rect width="1400" height="1000" fill="#ffffff"/>
    <text x="700" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111">FIG. 2 - Hero Intake and Score Recompute Cycle</text>
    
    <text x="700" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">User logs an AForce intake; orb pulse, recheck timer, and recovery banner update in lockstep</text>

    <ellipse cx="140" cy="130" rx="80" ry="28" fill="#fff" stroke="#111" stroke-width="1.5"/>
     <text x="140" y="135" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">User</text>
    <rect x="60" y="190" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="170" y="213" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Tap &quot;Log AForce&quot;</text><text x="170" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">Home Orb screen</text>
    <line x1="170" y1="158" x2="170" y2="190" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="280" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="170" y="303" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">CYCLE_START dispatched</text><text x="170" y="321" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">isCompletingCycle = true</text>
    <line x1="170" y1="246" x2="170" y2="280" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="370" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="170" y="393" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">POST /api/aforce/intake</text><text x="170" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">Authorization: Bearer JWT</text>
    <line x1="170" y1="336" x2="170" y2="370" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="360" y="370" width="240" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="480" y="393" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Server: rate-limit check</text><text x="480" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">per-user key + IP fallback</text>
    <line x1="280" y1="398" x2="360" y2="398" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="660" y="370" width="240" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="780" y="393" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Score Engine recompute</text><text x="780" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">pure deterministic function</text>
    <line x1="600" y1="398" x2="660" y2="398" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="960" y="370" width="280" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1100" y="393" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Persist user state + history</text><text x="1100" y="411" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">Drizzle / Postgres</text>
    <line x1="900" y1="398" x2="960" y2="398" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="660" y="470" width="240" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="780" y="493" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">WS broadcast</text><text x="780" y="511" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">state + score event</text>
    <line x1="780" y1="426" x2="780" y2="470" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="360" y="470" width="240" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="480" y="493" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">HTTP 200 response</text><text x="480" y="511" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">engineOutput payload</text>
    <line x1="660" y1="498" x2="600" y2="498" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="470" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="170" y="493" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Mobile: CYCLE_SUCCESS</text><text x="170" y="511" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">reducer applies result</text>
    <line x1="360" y1="498" x2="280" y2="498" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="580" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="170" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Orb pulse burst</text><text x="170" y="621" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">timestamp recorded</text>
    <rect x="310" y="580" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="420" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Recheck timer reset</text><text x="420" y="621" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">from riskTimer.minutes</text>
    <rect x="560" y="580" width="220" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="670" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Hero overlay shown</text><text x="670" y="621" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">silent=true suppresses</text>
    <rect x="810" y="580" width="240" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="930" y="603" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">Recovery card re-evaluates</text><text x="930" y="621" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">shown if score below threshold</text>

    <line x1="170" y1="526" x2="170" y2="580" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="280" y1="526" x2="420" y2="580" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="380" y1="526" x2="670" y2="580" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="600" y1="526" x2="930" y2="580" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <polygon points="1180,535 1290,580 1180,625 1070,580" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="1180" y="585" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#111">timerSeconds = 0 ?</text>
    <rect x="1080" y="720" width="200" height="56" rx="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1180" y="743" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#111">pendingConfirmation</text><text x="1180" y="761" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#444">prompt user to recheck</text>
    <line x1="1180" y1="625" x2="1180" y2="720" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1180" y="666.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">yes</text>
    <line x1="1290" y1="580" x2="1340" y2="540" stroke="#111" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1315" y="554" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">no - tick again</text>

    <rect x="60" y="800" width="1280" height="90" rx="4" fill="#fafaf2" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/><text x="70" y="818" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">The same reducer path is reused by the voice flow with silent=true,</text><text x="70" y="833" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">which suppresses the celebratory hero overlay but still bursts the orb,</text><text x="70" y="848" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#333">resets the timer, and updates the recovery card.</text>
  
    <text x="1380" y="984" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#777">AForce OS - Patent Figure</text>
  </svg>