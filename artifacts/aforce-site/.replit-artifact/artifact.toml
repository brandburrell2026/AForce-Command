kind = "web"
previewPath = "/aforce-site/"
title = "AForce — Marketing Site"
version = "1.0.0"
id = "artifacts/aforce-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/aforce-site/" ]
localPort = 21008

[services.development]
run = "pnpm --filter @workspace/aforce-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aforce-site", "run", "build" ]
publicDir = "artifacts/aforce-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21008"
BASE_PATH = "/aforce-site/"
