plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.aforce.hydroscan'
version = '1.0.0'

android {
  namespace 'com.aforce.hydroscan'
  // expo-module-gradle-plugin requires defaultConfig.versionName.
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Bundled Latin model: no first-use download, no image upload.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
