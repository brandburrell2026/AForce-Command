kind = "web"
previewPath = "/command-center/"
title = "AForce — Command Center"
version = "1.0.0"
id = "artifacts/aforce-command-center"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/command-center/" ]
localPort = 18176

[services.development]
run = "pnpm --filter @workspace/aforce-command-center run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aforce-command-center", "run", "build" ]
publicDir = "artifacts/aforce-command-center/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18176"
BASE_PATH = "/command-center/"
