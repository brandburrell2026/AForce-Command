kind = "slides"
previewPath = "/aforce-pitch/"
title = "AForce — Investor Deck"
version = "1.0.0"
id = "artifacts/aforce-pitch"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/aforce-pitch/" ]
localPort = 25410

[services.development]
run = "pnpm --filter @workspace/aforce-pitch run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aforce-pitch", "run", "build" ]
publicDir = "artifacts/aforce-pitch/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25410"
BASE_PATH = "/aforce-pitch/"
