name: CI

# Required-status-check contract (see docs/CI_BRANCH_PROTECTION.md before wiring
# branch protection): typecheck, tests-baseline, focused-health, governance-drift.
#
# FORMER known blockers on a truly fresh checkout, FIXED as of PR 2.2B
# (2026-08-03) — kept here as a record, not as an open TODO:
#   1. `pnpm install --frozen-lockfile` used to fail outright
#      (ERR_PNPM_IGNORED_BUILDS) because pnpm-workspace.yaml's `allowBuilds`
#      map was missing packages still listed only under the now-inert,
#      pnpm-11-removed `onlyBuiltDependencies` key. Fixed: `allowBuilds` now
#      carries an explicit true/false per package (see pnpm-workspace.yaml's
#      own comment for the evidence behind each decision — a fresh-store
#      install plus the real Clerk-dependent adversarial route suite were
#      both run to confirm the `false` entries are safe), and the dead
#      `onlyBuiltDependencies` block is gone.
#   2. `artifacts/aforce-os/package.json` hand-pinned `@types/node` to a
#      version string that merely happened to match the shared catalog
#      value rather than being sourced from it — one version bump away from
#      silently drifting apart. Fixed: it now reads `catalog:` directly,
#      same as every other workspace's `@types/node`.
# Re-verify both with `rm -rf node_modules && pnpm install --frozen-lockfile`
# (or an isolated `git worktree`) before assuming a future edit to either
# file hasn't reopened a real gap.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 11+: pnpm/action-setup is only maintained for pnpm v10 and older.
      # pnpm/setup installs the pnpm v11 standalone binary *and* Node in one
      # step. `version` is omitted deliberately — it reads packageManager
      # ("pnpm@11.1.2") from package.json, so this workflow and the repo's
      # pnpm pin can never drift apart.
      - name: Setup pnpm + Node
        uses: pnpm/setup@v1
        with:
          # No .nvmrc / engines field exists in this repo (verified 2026-08-03).
          # Pinned to 22 to match the Dockerfile (`FROM node:22-slim`) that
          # Railway builds from — the one place Node version parity actually
          # matters today. Recommend adding an `engines.node` field so this
          # pin has a single source of truth instead of living in two files.
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify install did not silently rewrite workspace config
        # pnpm's `allowBuilds` auto-approval mechanism writes a placeholder
        # entry into pnpm-workspace.yaml for any *new* dependency with an
        # unreviewed build script (see https://pnpm.io/settings/build#allowbuilds).
        # --frozen-lockfile guarantees pnpm-lock.yaml can't drift, but says
        # nothing about pnpm-workspace.yaml. This step converts a silent
        # mutation into a loud, actionable failure instead of trusting the
        # working tree is clean.
        run: |
          if ! git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then
            echo "::error::pnpm install mutated pnpm-workspace.yaml or pnpm-lock.yaml during CI."
            echo "This means a dependency change introduced a native build script pnpm hasn't"
            echo "seen before. Run 'pnpm install' locally, review the diff below, decide true/false"
            echo "for the new allowBuilds entry, and commit that decision as part of this PR."
            git diff -- pnpm-workspace.yaml pnpm-lock.yaml
            exit 1
          fi

      - name: Typecheck libs (tsc --build)
        run: pnpm run typecheck:libs

      - name: Typecheck aforce-os
        run: pnpm --filter @workspace/aforce-os run typecheck

      - name: Typecheck api-server
        run: pnpm --filter @workspace/api-server run typecheck

  tests-baseline:
    name: tests-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # ── Self-serving-edit protection (PR 2.2B, section C4) ──────────────
      #
      # The comparison step below decides pass/fail by reading
      # governance/TEST-BASELINE.md. Left unguarded, a single PR could both
      # (a) raise the documented failure ceiling in that file AND (b) add
      # new failing tests, using its own edit to launder a real regression
      # past this check. The fix: for a pull_request event, the numeric
      # comparison ALWAYS uses the baseline as it exists on the TARGET
      # branch (fetched fresh here), never the PR's own working copy of the
      # file — so editing the file in the PR cannot change what this PR is
      # judged against. On a push (no target branch to diff against — e.g.
      # a direct push to `main`), the checked-out HEAD copy is used, since
      # HEAD *is* the branch of record at that point.
      - name: Fetch target branch (PRs only, shallow)
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Resolve the baseline to compare against
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Using governance/TEST-BASELINE.md from target branch 'origin/${{ github.base_ref }}' (not this PR's copy)."
            git show "origin/${{ github.base_ref }}:governance/TEST-BASELINE.md" > target-baseline.md
          else
            echo "Push event — no target branch to diff against; using HEAD's governance/TEST-BASELINE.md."
            cp governance/TEST-BASELINE.md target-baseline.md
          fi

      # A PR is still allowed to edit TEST-BASELINE.md (e.g. to legitimately
      # lower it after fixing tests, or raise it with an accepted new gap) —
      # it just can't do so silently. Requiring a human-applied label turns
      # "the ceiling moved" into something a reviewer has to consciously
      # notice and approve, rather than a diff hunk that scrolls by. Note
      # this step only GATES the edit; the comparison above still measures
      # against the TARGET's baseline either way (see rationale above), so
      # the new numbers in the PR's copy take effect for OTHER PRs only
      # once this one merges.
      - name: Guard against unacknowledged TEST-BASELINE.md edits
        if: >
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'baseline-override')
        run: |
          if ! git diff --quiet "origin/${{ github.base_ref }}" HEAD -- governance/TEST-BASELINE.md; then
            echo "::error::This PR modifies governance/TEST-BASELINE.md without the 'baseline-override' label. A PR must not be able to silently move its own pass/fail ceiling — see docs/CI_BRANCH_PROTECTION.md. Ask a reviewer to confirm the new baseline is legitimate and apply the 'baseline-override' label, then re-run this check."
            git diff "origin/${{ github.base_ref }}" HEAD -- governance/TEST-BASELINE.md
            exit 1
          fi

      # Canonical no-DB run (governance/TEST-BASELINE.md §1). DATABASE_URL is
      # deliberately left UNSET: the documented baseline already accounts for
      # the ~33 files that fail to load without it (Cause B in the doc). A
      # real Postgres for these paths is exercised separately by the
      # integration workflow via Testcontainers, not here.
      #
      # `|| true`: a run at/under baseline is expected to exit non-zero
      # (vitest's own exit code reflects the 18 known-failing WHOOP assertions).
      # The baseline-comparison step below is what actually decides pass/fail
      # for this job — not vitest's exit code.
      - name: Run canonical suite (JSON report)
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json=vitest-report.json || true

      - name: Compare against documented baseline (governance/TEST-BASELINE.md, target-branch copy)
        run: |
          node <<'NODESCRIPT'
          const fs = require('fs');

          // Fallback only — kept in sync with governance/TEST-BASELINE.md §2.
          // Used solely if the doc's table can't be parsed at runtime (e.g. its
          // format changed). If you touch this number, update the doc too, or
          // better: fix the doc so the runtime parse succeeds again.
          const FALLBACK_FAILED_FILES = 45;
          const FALLBACK_FAILED_TESTS = 18;

          // target-baseline.md is the TARGET branch's copy (see the
          // "Resolve the baseline to compare against" step above) — never
          // this PR's own working copy — so a PR editing TEST-BASELINE.md
          // cannot change what it is judged against.
          const baselineDoc = fs.readFileSync('target-baseline.md', 'utf8');
          const filesMatch = baselineDoc.match(/\*\*Test files — failed\*\*\s*\|\s*\*\*(\d+)\*\*/);
          const testsMatch = baselineDoc.match(/\*\*Tests — failed\*\*\s*\|\s*\*\*(\d+)\*\*/);

          let baselineFiles, baselineTests, source;
          if (filesMatch && testsMatch) {
            baselineFiles = Number(filesMatch[1]);
            baselineTests = Number(testsMatch[1]);
            source = 'governance/TEST-BASELINE.md (parsed at runtime)';
          } else {
            baselineFiles = FALLBACK_FAILED_FILES;
            baselineTests = FALLBACK_FAILED_TESTS;
            source = 'pinned fallback constants in ci.yml (doc table did not parse — fix the doc)';
            console.log('::warning::Could not parse governance/TEST-BASELINE.md; using pinned fallback constants.');
          }

          const report = JSON.parse(fs.readFileSync('vitest-report.json', 'utf8'));
          // testResults[].status is the per-FILE outcome — this is what
          // TEST-BASELINE.md calls "Test files" (and what the vitest console
          // reporter's "Test Files" line reports). numFailedTestSuites counts
          // describe blocks, not files, and does NOT match the doc's metric —
          // verified empirically before wiring this up.
          const failedFiles = report.testResults.filter((t) => t.status === 'failed').length;
          const failedTests = report.numFailedTests;

          console.log(`Baseline source: ${source}`);
          console.log(`Baseline:  ${baselineFiles} failed files / ${baselineTests} failed tests`);
          console.log(`Observed:  ${failedFiles} failed files / ${failedTests} failed tests`);

          let regressed = false;
          if (failedFiles > baselineFiles) {
            console.log(`::error::${failedFiles} failed files exceeds documented baseline of ${baselineFiles} — new regression, investigate before merging.`);
            regressed = true;
          }
          if (failedTests > baselineTests) {
            console.log(`::error::${failedTests} failed tests exceeds documented baseline of ${baselineTests} — new regression, investigate before merging.`);
            regressed = true;
          }
          if (regressed) {
            console.log('New PASSING tests are always fine; only a rise in FAILURES fails this check. See governance/TEST-BASELINE.md §5 for the full new-vs-expected criteria.');
            process.exit(1);
          }
          console.log('Within documented baseline — no new regressions.');
          NODESCRIPT

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: vitest-report.json
          retention-days: 14

  focused-health:
    name: focused-health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm + Node
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fast, DB-free signal over the health/wearable-parity core: must stay
      # 100% green (no baseline tolerance here — unlike tests-baseline, any
      # failure in this lane is a real regression by construction, since none
      # of these suites are in the documented DATABASE_URL/RN-parse failure set).
      - name: Run focused health suite
        run: >
          pnpm exec vitest run
          lib/health-core
          artifacts/aforce-os/services/health
          artifacts/api-server/src/__tests__/whoopParity
          artifacts/api-server/src/lib/garminMock

  db-lane:
    name: db-lane
    runs-on: ubuntu-latest
    # Real-Postgres suites carved out of the unit lane (Wave-4): the nine
    # api-server suites listed explicitly in vitest.db.config.ts. They are
    # guarded with describe.runIf(DB_TESTS) so tests-baseline skips them;
    # this job is where they actually execute, against the service container
    # below. Throwaway credentials, job-local network — nothing here is a
    # real secret or reachable outside the runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aforce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/aforce_test
      DB_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same deterministic pnpm+Node provisioning as integration.yml (the
      # pnpm/setup@v1 `runtime` path used by the older jobs above proved
      # flaky there — see integration.yml's comment).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Apply the Drizzle schema to the empty service database before any
      # suite runs. `push-force` (lib/db/package.json) is drizzle-kit push
      # --force against DATABASE_URL — safe here by construction: the target
      # is this job's throwaway container, never a shared environment.
      - name: Apply schema (drizzle-kit push)
        run: pnpm --filter @workspace/db push-force

      - name: Run DB lane (real Postgres)
        run: pnpm test:db

  governance-drift:
    name: governance-drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Enforces Founder Decision 3 (2026-07-22): /governance is the sole
      # authoritative source; no stray or diverged copies under artifacts/.
      # Pure node:fs/node:path — no dependency install needed.
      - name: Check governance drift
        run: node scripts/src/check-governance-drift.mjs

      # Phase-4 credential containment (2026-08-04): fail if a live-looking
      # secret pattern lands in any TRACKED file. Prints file:line + pattern
      # name only — never matched content.
      - name: Secrets guard
        run: node scripts/src/check-secrets.mjs
