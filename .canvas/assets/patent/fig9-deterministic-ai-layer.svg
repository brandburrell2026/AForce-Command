<?xml version="1.0" encoding="UTF-8"?>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
      </marker>
    </defs>
    <rect width="1400" height="1000" fill="#ffffff"/>
    <text x="700" y="46" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111">FIG. 9 — Deterministic AI Layer (Rule-Based Decision Fabric)</text>
    
    <text x="700" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">Explainable, auditable decisioning between raw signals and user-facing prompts</text>

    <rect x="60" y="110" width="1280" height="130" rx="14" ry="14" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="3 4"/>
     <text x="74" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Stage 1 — Signal Fusion</text>
    <rect x="80" y="150" width="200" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="180" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Biometric stream</text><text x="180" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">HRV · RHR · sleep · steps</text>
    <rect x="300" y="150" width="200" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="400" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Intake stream</text><text x="400" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">logged drinks / sticks</text>
    <rect x="520" y="150" width="200" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="620" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Symptom stream</text><text x="620" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">urine · energy · self-report</text>
    <rect x="740" y="150" width="200" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="840" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Environmental</text><text x="840" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">weather · time-of-day</text>
    <rect x="960" y="150" width="200" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1060" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Behavioral</text><text x="1060" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">streak · compliance</text>
    <rect x="1180" y="150" width="140" height="70" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1250" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Social</text><text x="1250" y="198" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">BAC inputs</text>

    <line x1="700" y1="240" x2="700" y2="280" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="280" width="1280" height="130" rx="14" ry="14" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="3 4"/>
     <text x="74" y="302" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Stage 2 — Normalization & Confidence</text>
    <rect x="120" y="320" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="260" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Unit normalization</text><text x="260" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">oz / mL / °C / °F</text>
    <rect x="420" y="320" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="560" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Range clamps & validators</text><text x="560" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">reject implausible values</text>
    <rect x="720" y="320" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="860" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Per-signal confidence</text><text x="860" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">high / med / low</text>
    <rect x="1020" y="320" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1160" y="345" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Freshness check</text><text x="1160" y="363" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">stale data → downweighted</text>

    <line x1="700" y1="410" x2="700" y2="450" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="450" width="1280" height="200" rx="14" ry="14" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="3 4"/>
     <text x="74" y="472" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Stage 3 — Rule Pipeline (deterministic, ordered, explainable)</text>
    <rect x="120" y="490" width="220" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="230" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Hydration rules</text>
    <rect x="360" y="490" width="220" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="470" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Heat / sweat rules</text>
    <rect x="600" y="490" width="220" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="710" y="515" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Recovery rules</text><text x="710" y="533" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">HRV-aware</text>
    <rect x="840" y="490" width="220" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="950" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Social / BAC rules</text>
    <rect x="1080" y="490" width="220" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1190" y="524" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Snooze / quiet hours</text>

    <rect x="120" y="570" width="1180" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="710" y="604" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Each rule emits: contribution to score · reason string · urgency tag · candidate command. Rules are pure JS; no ML weights.</text>

    <line x1="700" y1="660" x2="700" y2="700" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="60" y="700" width="1280" height="220" rx="14" ry="14" fill="none" stroke="#111" stroke-width="1.2" stroke-dasharray="3 4"/>
     <text x="74" y="722" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#111">Stage 4 — Decision Synthesis</text>
    <rect x="120" y="740" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="260" y="765" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Score aggregator</text><text x="260" y="783" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">weighted sum</text>
    <rect x="420" y="740" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="560" y="765" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Command selector</text><text x="560" y="783" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">highest-impact, urgency-tied</text>
    <rect x="720" y="740" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="860" y="765" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Reasoning trace</text><text x="860" y="783" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">reasons[] surfaced in UI</text>
    <rect x="1020" y="740" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="1160" y="765" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Pulse config builder</text><text x="1160" y="783" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#444">animation maps to urgency</text>

    <rect x="120" y="820" width="1180" height="80" rx="8" ry="8" fill="#ffffff" stroke="#111" stroke-width="1.5"/><text x="710" y="864" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#111">Auditable: every score and command can be reproduced from a captured input snapshot. No remote inference. No nondeterministic LLM calls in this layer.</text>
  
    <text x="1380" y="984" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#777">AForce OS · Patent Figure</text>
  </svg>